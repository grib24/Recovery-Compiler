name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'MANIFEST_URL'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'twrp-14.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/grib24/twrp_device_realme_RE6054'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/realme/RE6054'
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'RE6054'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'twrp'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'vendorboot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot

jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential zip curl libc6-dev libncurses5-dev libssl-dev python3 python3-pip git
        curl -L https://storage.googleapis.com/git-repo-downloads/repo > repo
        chmod a+x repo
        sudo mv repo /usr/local/bin/repo


    - name: Build TWRP
      run: |
        git config --global user.email "grib24@github.com"
        git config --global user.name "grib24"
        mkdir twrp && cd twrp
        /usr/local/bin/repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
        /usr/local/bin/repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --current-branch


        # Patch bootable/recovery for twrp-14.1 fscrypt_policy_v2 and full legacy FDE cryptfs API
        python3 - << 'EOF'
        import glob, re, os

        hdr_path = "bootable/recovery/libtar/libtar.h"
        with open(hdr_path, "r") as f:
            hdr = f.read()

        compat = """
        #ifndef LIBTAR_FSCRYPT_COMPAT
        #define LIBTAR_FSCRYPT_COMPAT
        #include <linux/fscrypt.h>
        #include <stdint.h>
        #include <stddef.h>
        #include <stdbool.h>
        #ifdef fscrypt_policy
        #undef fscrypt_policy
        #endif
        typedef struct fscrypt_policy_v2 fscrypt_policy;
        static inline size_t fscrypt_policy_size(const fscrypt_policy *p) { (void)p; return sizeof(struct fscrypt_policy_v2); }
        static inline size_t get_policy_size(const fscrypt_policy *p, bool v1) { (void)p; (void)v1; return sizeof(struct fscrypt_policy_v2); }
        static inline void *get_policy(fscrypt_policy *p) { return (void *)p; }
        static inline uint8_t *get_policy_descriptor(fscrypt_policy *p) { return p->master_key_identifier; }
        #endif
        """

        hdr = re.sub(r'(#include\s+<fscrypt/fscrypt\.h>)', r'\1\n' + compat, hdr, count=1)
        if "LIBTAR_FSCRYPT_COMPAT" not in hdr:
            hdr = compat + "\n" + hdr

        with open(hdr_path, "w") as f:
            f.write(hdr)

        for cfile in glob.glob("bootable/recovery/libtar/*.c"):
            with open(cfile, "r") as f:
                txt = f.read()
            if "libtar.h" not in txt:
                txt = '#include "libtar.h"\n' + txt
            txt = txt.replace("lookup_ref_tar(t->th_buf.fep,", "lookup_ref_tar((const uint8_t *)t->th_buf.fep,")
            with open(cfile, "w") as f:
                f.write(txt)

        stub_cpp = """
        #include <stdarg.h>
        #include <stdint.h>
        extern "C" int async_safe_format_log(int prio, const char* tag, const char* fmt, ...) { (void)prio; (void)tag; (void)fmt; return 0; }
        class NetlinkEvent { public: void dump(); const char* findParam(const char* paramName); };
        void NetlinkEvent::dump() {}
        const char* NetlinkEvent::findParam(const char*) { return nullptr; }
        namespace android { namespace hal { class BootControlClient { public: static void* WaitForService(); }; void* BootControlClient::WaitForService() { return nullptr; } } }
        namespace ndk { class SpAIBinder; }
        namespace aidl { namespace android { namespace security { namespace maintenance { class IKeystoreMaintenance { public: static void* fromBinder(const ndk::SpAIBinder&); }; void* IKeystoreMaintenance::fromBinder(const ndk::SpAIBinder&) { return nullptr; } } } } }
        """
        with open("bootable/recovery/libtar/twrp_compat_stubs.cpp", "w") as f:
            f.write(stub_cpp)

        mk = "bootable/recovery/libtar/Android.mk"
        if os.path.exists(mk):
            with open(mk, "r") as f:
                lines = f.readlines()
            new_lines = []
            for line in lines:
                if "LOCAL_SRC_FILES :=" in line and "append.c" in line:
                    line = line.rstrip("\n") + " twrp_compat_stubs.cpp\n"
                new_lines.append(line)
            with open(mk, "w") as f:
                f.writelines(new_lines)

        fde_stubs = """
        #ifndef TWRP_FDE_COMPAT_STUBS
        #define TWRP_FDE_COMPAT_STUBS
        #pragma clang diagnostic push
        #pragma clang diagnostic ignored "-Wunused-function"
        #ifdef __cplusplus
        extern "C" {
        #endif
        static inline void set_partition_data(const char* blk_dev, const char* key_loc) { (void)blk_dev; (void)key_loc; }
        static inline int cryptfs_check_footer(void) { return -1; }
        static inline int delete_crypto_blk_dev(const char* name) { (void)name; return 0; }
        static inline int cryptfs_get_password_type(void) { return 0; }
        static inline int cryptfs_check_passwd(const char* passwd) { (void)passwd; return -1; }
        static inline int cryptfs_verify_passwd(const char* passwd) { (void)passwd; return -1; }
        static inline int cryptfs_restart(void) { return 0; }
        static inline int cryptfs_enable(const char* howarg, int type, const char* passwd, int no_ui) { (void)howarg; (void)type; (void)passwd; (void)no_ui; return -1; }
        static inline int cryptfs_enable_default(const char* howarg, int no_ui) { (void)howarg; (void)no_ui; return -1; }
        static inline int cryptfs_changepw(int type, const char* newpw) { (void)type; (void)newpw; return -1; }
        static inline int cryptfs_setup_ext_volume(const char* label, const char* real_blkdev, const unsigned char* key, int keysize, char* out_crypto_blkdev) { (void)label; (void)real_blkdev; (void)key; (void)keysize; (void)out_crypto_blkdev; return -1; }
        static inline int cryptfs_revert_ext_volume(const char* label) { (void)label; return 0; }
        static inline int cryptfs_getfield(const char* fieldname, char* value, int len) { (void)fieldname; (void)value; (void)len; return -1; }
        static inline int cryptfs_setfield(const char* fieldname, const char* value) { (void)fieldname; (void)value; return -1; }
        static inline int cryptfs_is_ice(void) { return 0; }
        static inline int cryptfs_trigger_restart_framework(void) { return 0; }
        static inline int cryptfs_trigger_restart_min_framework(void) { return 0; }
        #ifdef __cplusplus
        }
        #endif
        #pragma clang diagnostic pop
        #endif
        """
        for cpp in glob.glob("bootable/recovery/**/*.cpp", recursive=True):
            with open(cpp, "r", errors="ignore") as f:
                c = f.read()
            if "TWRP_FDE_COMPAT_STUBS" not in c:
                with open(cpp, "w") as f:
                    f.write(fde_stubs + "\n" + c)
        EOF

    

        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.DEVICE_PATH }}
        cd ${{ github.event.inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV
        cd ${GITHUB_WORKSPACE}/twrp
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        if [[ "${{ github.event.inputs.MANIFEST_BRANCH }}" == "twrp-14.1" ]]; then
          lunch ${{ github.event.inputs.MAKEFILE_NAME }}_${{ github.event.inputs.DEVICE_NAME }}-ap2a-eng
        else
          lunch ${{ github.event.inputs.MAKEFILE_NAME }}_${{ github.event.inputs.DEVICE_NAME }}-eng
        fi
        make clean
        mka adbd ${{ github.event.inputs.BUILD_TARGET }}image

    - name: Set Release Properties
      run: |
        echo "BUILD_DATE=$(TZ=Europe/Moscow date +%Y%m%d)" >> $GITHUB_ENV
        DEVICE_TREE_URL="${{ github.event.inputs.DEVICE_TREE_URL }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        fail_on_unmatched_files: false
        files: |
          twrp/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/vendor_boot.img
        name: TWRP Recovery for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: twrp-${{ github.run_id }}
        body: |
          ## TWRP Recovery Build - Unofficial
          Build: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/tree/${{ github.event.inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}) during building.
